name: Run Buff Knife Tracker

on:
  schedule:
    - cron: '0 0 * * *'     # Runs at 12:00 AM UTC
    - cron: '0 12 * * *'    # Runs at 12:00 PM UTC
  workflow_dispatch:        # Allows manual run via GitHub UI

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    env:
      GSHEET_CREDS_JSON: ${{ secrets.GSHEET_CREDS }}
      BUFF_COOKIE: ${{ secrets.BUFF_COOKIE }}
      BUFF_SHEET_NAME: BuffKnifeTracker

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: buff163.price-checker
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the Buff tracker
        working-directory: buff163.price-checker
        run: |
          python main.py
