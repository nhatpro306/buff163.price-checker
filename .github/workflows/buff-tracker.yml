name: Run Buff Knife Tracker

on:
  schedule:
    - cron: '0 15 * * *'    # 00:00 JST
    - cron: '0 3 * * *'     # 12:00 JST
  workflow_dispatch:        # Allows manual run via GitHub UI

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    env:
      GSHEET_CREDS_JSON: ${{ secrets.GSHEET_CREDS_JSON }}
      GSHEET_CREDS: ${{ secrets.GSHEET_CREDS }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GSHEET_CREDS_JSON }}
      BUFF_COOKIE: ${{ secrets.BUFF_COOKIE }}
      BUFF_SHEET_NAME: BuffKnifeTracker
      BUFF_MIN_PRICE_CNY: "0"
      BUFF_HIGH_VALUE_PAGES: "6"
      BUFF_MARKET_PAGE_DELAY: "3.0"
      BUFF_MAX_429_ATTEMPTS: "3"
      BUFF_TRACK_KEYWORDS: "Bayonet,Bowie Knife,Butterfly Knife,Classic Knife,Falchion Knife,Flip Knife,Gut Knife,Huntsman Knife,Karambit,Kukri Knife,M9 Bayonet,Navaja Knife,Nomad Knife,Paracord Knife,Shadow Daggers,Skeleton Knife,Stiletto Knife,Survival Knife,Talon Knife,Ursus Knife"
      BUFF_FULL_CATALOG: "0"
      BUFF_FULL_CATALOG_PAGES: "12"
      BUFF_RUN_MIGRATION: "0"
      BUFF_FALLBACK_CSGOTRADER: "1"
      BUFF_MIN_FALLBACK_SNAPSHOTS: "3000"
      BUFF_ENABLE_FORECAST: "0"
      BUFF_LISTINGS_ONLY_DIRECT: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m unittest tests.test_snapshot_merge

      - name: Run the Buff tracker
        run: |
          python main.py
