name: Run Buff Knife Tracker

on:
  schedule:
    - cron: '0 23 * * *'    # 08:00 JST
    - cron: '0 9 * * *'     # 18:00 JST
  workflow_dispatch:        # Allows manual run via GitHub UI

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    env:
      GSHEET_CREDS_JSON: ${{ secrets.GSHEET_CREDS_JSON }}
      GSHEET_CREDS: ${{ secrets.GSHEET_CREDS }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GSHEET_CREDS_JSON }}
      BUFF_COOKIE: ${{ secrets.BUFF_COOKIE }}
      BUFF_SHEET_NAME: BuffKnifeTracker
      BUFF_MIN_PRICE_CNY: "5000"
      BUFF_HIGH_VALUE_PAGES: "12"
      BUFF_TRACK_KEYWORDS: "Butterfly Knife,Karambit"
      BUFF_FULL_CATALOG: "0"
      BUFF_FULL_CATALOG_PAGES: "12"
      BUFF_RUN_MIGRATION: "0"
      BUFF_ENABLE_FORECAST: "0"

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the Buff tracker
        run: |
          python main.py
