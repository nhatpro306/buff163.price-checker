name: Lint & Type Check

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff black mypy types-requests pytest pytest-cov
      - run: ruff check .
      - run: black --check .
      - run: mypy src main.py
      - run: python -m pytest
